<div class="form-container">

  <div class="form-card">

    <h1>Women Safety</h1>
    <h2>Create Account</h2>
    <p class="subtitle">Register to use the safety system</p>

    <form (ngSubmit)="register()">

      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          type="tel"
          name="phone"
          [(ngModel)]="phone"
          placeholder="Enter your phone number"
          required>
      </div>

      <button type="submit">Register</button>

    </form>

    <p class="bottom-text">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</div>
